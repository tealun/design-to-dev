name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Platform rules and design-to-dev.zip are up to date
        run: python3 scripts/build.py --check
      - name: The bundled example passes the output checker
        run: python3 skills/design-to-dev/scripts/check_output.py examples/readlog/output --mode B
